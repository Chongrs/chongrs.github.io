<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0f0e0d;
    --paper: #f5f0e8;
    --accent: #c8441a;
    --muted: #8a8070;
    --border: #d4cdc0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Grain texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  /* Large background 404 */
  .bg-num {
    position: fixed;
    font-size: clamp(260px, 40vw, 520px);
    font-weight: 800;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--border);
    letter-spacing: -0.05em;
    user-select: none;
    z-index: 0;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    line-height: 1;
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 560px;
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .label::before, .label::after {
    content: '';
    width: 40px;
    height: 1px;
    background: var(--border);
  }

  .headline {
    font-size: clamp(38px, 7vw, 68px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 1.25rem;
  }

  .headline em {
    font-style: normal;
    color: var(--accent);
  }

  .sub {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.75;
    margin-bottom: 2.5rem;
    font-style: italic;
  }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 2px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
    display: inline-block;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border: none;
  }

  .btn-primary:hover { background: var(--accent); }

  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--border);
  }

  .btn-ghost:hover { border-color: var(--ink); }

  /* Decorative rule */
  .rule {
    width: 60px;
    height: 3px;
    background: var(--accent);
    margin: 0 auto 2rem;
    border-radius: 2px;
    animation: expand 0.6s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    transform-origin: center;
  }

  @keyframes expand {
    from { transform: scaleX(0); opacity: 0; }
    to   { transform: scaleX(1); opacity: 1; }
  }

  /* Floating corner marks */
  .corner {
    position: fixed;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--border);
    letter-spacing: 0.1em;
    z-index: 1;
  }
  .corner.tl { top: 28px; left: 32px; }
  .corner.tr { top: 28px; right: 32px; }
  .corner.bl { bottom: 28px; left: 32px; }
  .corner.br { bottom: 28px; right: 32px; }
</style>
</head>
<body>

<div class="bg-num" aria-hidden="true">404</div>

<span class="corner tl">error / 404</span>
<span class="corner tr">not found</span>
<span class="corner bl">©2026</span>
<span class="corner br">x: 0 y: 0</span>

<div class="container">
  <div class="label">error 404</div>
  <div class="rule"></div>
  <h1 class="headline">This page<br>went <em>missing.</em></h1>
</div>

<script>
  // Subtle parallax on the background number
  const bg = document.querySelector('.bg-num');
  document.addEventListener('mousemove', e => {
    const x = (e.clientX / window.innerWidth - 0.5) * 18;
    const y = (e.clientY / window.innerHeight - 0.5) * 10;
    bg.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  });

  // Update corner coordinate display
  const br = document.querySelector('.corner.br');
  document.addEventListener('mousemove', e => {
    br.textContent = `x: ${e.clientX} y: ${e.clientY}`;
  });
</script>
</body>
</html>
